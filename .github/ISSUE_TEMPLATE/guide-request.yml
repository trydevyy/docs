name: Guide request
description: Suggest a guide or a missing section
title: "Guide: "
body:
  - type: textarea
    id: task
    attributes:
      label: What should the reader be able to do?
      description: Describe the task and where the existing documentation leaves you stuck.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Suggested scope
      description: List relevant prerequisites, platforms, or related guides.
